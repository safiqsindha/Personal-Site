<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Safiq Sindha</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#152219">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--forest:#152219;--cream:#EFE7D6;--cream-dim:rgba(239,231,214,.68);--ochre:#C89A4A;--rule:rgba(239,231,214,.14)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--forest);color:var(--cream);font-family:'Inter',system-ui,sans-serif;font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;min-height:100svh;display:flex;align-items:center}
  a{color:inherit}
  a:focus-visible{outline:2px solid var(--ochre);outline-offset:3px;border-radius:2px}
  main{width:100%;max-width:720px;margin:0 auto;padding:48px 28px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ochre);margin-bottom:14px;display:flex;align-items:center;gap:12px}
  .eyebrow::after{content:'';flex:1;height:1px;background:var(--rule)}
  h1{font-family:'Fraunces',serif;font-weight:700;font-size:clamp(36px,8vw,60px);line-height:1.05;letter-spacing:-.03em;margin-bottom:14px}
  p{color:var(--cream-dim);max-width:52ch;margin-bottom:28px}
  nav{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:15px}
  nav a{color:var(--cream);text-decoration-color:var(--ochre);text-underline-offset:5px;padding:8px 0}
</style>
</head>
<body>
<main>
  <div class="eyebrow">404</div>
  <h1>Page not found</h1>
  <p>That address doesn't lead anywhere. It may have moved, or the link may have a typo.</p>
  <nav aria-label="Where to go next"><a href="/">Home</a><a href="/blog/">Writing</a></nav>
</main>
</body>
</html>
